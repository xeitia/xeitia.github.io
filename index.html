<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeitia — En mantenimiento</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 600px; }
        .logo {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; color: #94a3b8; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 2rem; }
        .email { color: #38bdf8; text-decoration: none; }
        .email:hover { text-decoration: underline; }
        .divider { width: 60px; height: 2px; background: linear-gradient(90deg, #38bdf8, #818cf8); margin: 2rem auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Xeitia</div>
        <h1>Sitio en mantenimiento</h1>
        <p>
            Este sitio web se encuentra temporalmente fuera de servicio.<br>
            Gracias por tu interés.
        </p>
        <div class="divider"></div>
        <p>
            Para cualquier consulta: <a href="mailto:info@xeitia.es" class="email">info@xeitia.es</a>
        </p>
    </div>
</body>
</html>
